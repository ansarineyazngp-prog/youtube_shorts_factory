# Recurring background jobs schedule (Rails 8 Solid Queue)

default: &default
  daily_youtube_shorts_pipeline:
    class: DailyShortsSchedulerJob
    queue: default
    schedule: every day at 9:00am

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
